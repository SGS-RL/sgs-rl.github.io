name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress run.
concurrency:
  group: pages
  cancel-in-progress: false

# The videos are not in git: they are assets of this release
# (scripts/lab/release_media.sh).
env:
  MEDIA_TAG: media-v1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - uses: actions/configure-pages@v5
      - run: npm ci
      - name: Fetch the site's videos from the media release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$MEDIA_TAG" --pattern sgs-media-library.tar --dir "$RUNNER_TEMP"
          mkdir -p public/media
          tar -xf "$RUNNER_TEMP/sgs-media-library.tar" -C public/media
          du -sh public/media/library
      - name: Build
        env:
          # The Download buttons link to the release's 1080p files.
          NEXT_PUBLIC_DOWNLOAD_BASE: https://github.com/${{ github.repository }}/releases/download/${{ env.MEDIA_TAG }}
        # The Google Fonts fetch during the build is occasionally flaky.
        run: for i in 1 2 3; do npm run build && exit 0; sleep 10; done; exit 1
      # The design studies (/lab/) stay on the Cloudflare preview and local
      # builds; the site is the homepage and /terms/ (owner, 2026-10-09).
      - name: Leave out the design studies
        run: rm -rf out/lab
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
